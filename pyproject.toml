[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathematical-modeling-casebook"
version = "0.1.0"
description = "Reproducible examples for MCDM, optimization and forecasting."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
modeling-casebook = "modeling_casebook.demo:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
